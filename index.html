<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Cafe - Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FIREBASE REALTIME DB SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f5f0; color: #2c221e; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header { background: rgba(247, 245, 240, 0.9); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="pb-36 min-h-screen antialiased">

    <!-- SPLASH SCREEN -->
    <div id="splashTheme" class="fixed inset-0 bg-[#1c1816] z-50 flex flex-col items-center justify-between p-8 text-center text-white transition-opacity duration-700">
        <div class="my-auto space-y-6">
            <div class="w-28 h-28 bg-amber-500 rounded-full flex items-center justify-center mx-auto text-5xl shadow-2xl">☕</div>
            <div class="space-y-2">
                <span id="splashTableText" class="text-[10px] font-extrabold uppercase tracking-widest text-amber-400 bg-amber-950/80 px-4 py-1.5 rounded-full border border-amber-800">Table #1 Live</span>
                <h1 class="text-3xl font-extrabold text-stone-100">DEMO CAFE</h1>
                <p class="text-xs text-stone-400">Specialty Coffee & Handcrafted Eats</p>
            </div>
        </div>
        <button onclick="startApp()" class="w-full max-w-xs py-4 bg-amber-500 text-stone-950 font-extrabold text-xs uppercase rounded-2xl shadow-xl">
            Open Menu ➔
        </button>
    </div>

    <!-- WELCOME MODAL -->
    <div id="welcomeModal" class="fixed inset-0 bg-stone-950/60 backdrop-blur-sm z-40 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-7 shadow-2xl text-center space-y-5">
            <h2 class="text-xl font-bold text-stone-900">Welcome to Demo Cafe</h2>
            <div class="space-y-3 text-left">
                <input type="text" id="custName" placeholder="Your Name" class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-2xl text-xs font-semibold">
                <input type="tel" id="custPhone" placeholder="Mobile Number" class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-2xl text-xs font-semibold">
            </div>
            <button onclick="saveCustomerDetails()" class="w-full py-3.5 bg-stone-900 text-white font-bold text-xs rounded-2xl">Continue to Menu ➔</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="sticky top-0 glass-header z-20 border-b border-stone-200/80 px-4 py-3.5">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 bg-[#1c1816] text-amber-400 rounded-2xl flex items-center justify-center font-bold text-base">☕</div>
                <div>
                    <h1 class="text-base font-extrabold text-stone-900">Demo Cafe</h1>
                    <span id="headerTableBadge" class="text-[10px] font-extrabold bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full">TABLE #1</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MENU CONTAINER -->
    <main id="menuContainer" class="p-4 space-y-4"></main>

    <!-- FLOATING CART BAR -->
    <div id="cartBar" class="fixed bottom-5 left-4 right-4 bg-stone-900 text-white rounded-2xl p-4 shadow-2xl flex justify-between items-center hidden z-30">
        <div>
            <p id="cartItemsCount" class="text-[10px] font-bold text-amber-400">0 ITEMS</p>
            <p id="cartTotal" class="text-lg font-black text-white">₹0</p>
        </div>
        <button onclick="placeOrder()" class="font-bold text-xs bg-amber-500 text-stone-950 px-5 py-3 rounded-xl">Place Order ➔</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeZq246X-z908x-Il0F-m86c1DaTXlgI4",
            authDomain: "fir-cafe-bd31f.firebaseapp.com",
            databaseURL: "https://fir-cafe-bd31f-default-rtdb.firebaseio.com",
            projectId: "fir-cafe-bd31f",
            storageBucket: "fir-cafe-bd31f.firebasestorage.app",
            messagingSenderId: "277510970587",
            appId: "1:277510970587:web:3836a5c62df85e26df00fe",
            measurementId: "G-YH34524HLJ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const tableNo = urlParams.get('table') || '1';

        let menuItems = [];
        let cart = {};

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('splashTableText').innerText = `Table #${tableNo} Live`;
            document.getElementById('headerTableBadge').innerText = `TABLE #${tableNo}`;
            
            db.ref('menu').on('value', (snapshot) => {
                const data = snapshot.val();
                menuItems = data ? Object.values(data) : [];
                renderMenu();
            });
        });

        function startApp() {
            document.getElementById('splashTheme').style.opacity = '0';
            setTimeout(() => document.getElementById('splashTheme').classList.add('hidden'), 700);
            document.getElementById('welcomeModal').classList.remove('hidden');
        }

        function saveCustomerDetails() {
            document.getElementById('welcomeModal').classList.add('hidden');
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            if(menuItems.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-stone-400 text-xs font-semibold">No items available right now. Admin will add items soon!</div>`;
                return;
            }

            menuItems.forEach(item => {
                const isAvailable = item.inStock !== false;
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-3xl border border-stone-200 flex justify-between gap-4 shadow-xs ${!isAvailable ? 'opacity-50' : ''}">
                        <div class="space-y-1.5 flex-1">
                            <h3 class="font-bold text-stone-900 text-sm">${item.name}</h3>
                            <p class="text-xs font-extrabold text-stone-900">₹${item.price}</p>
                            <p class="text-[11px] text-stone-400">${item.desc || ''}</p>
                        </div>
                        <div class="relative w-24 h-24 shrink-0">
                            <img src="${item.img}" class="w-full h-full object-cover rounded-2xl">
                            ${isAvailable ? `<button onclick="addToCart(${item.id})" class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-white text-stone-900 border font-bold px-3 py-1 rounded-xl text-xs">+ Add</button>` : '<span class="absolute bottom-1 left-1/2 -translate-x-1/2 text-[9px] font-black bg-red-100 text-red-600 px-1.5 py-0.5 rounded">OUT OF STOCK</span>'}
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if(!item) return;
            cart[itemId] = (cart[itemId] || 0) + 1;
            updateCartBar();
        }

        function updateCartBar() {
            let totalCount = 0, totalAmount = 0;
            menuItems.forEach(i => {
                if(cart[i.id]) {
                    totalCount += cart[i.id];
                    totalAmount += cart[i.id] * i.price;
                }
            });

            if(totalCount > 0) {
                document.getElementById('cartBar').classList.remove('hidden');
                document.getElementById('cartItemsCount').innerText = `${totalCount} ITEMS`;
                document.getElementById('cartTotal').innerText = `₹${totalAmount}`;
            } else {
                document.getElementById('cartBar').classList.add('hidden');
            }
        }

        function placeOrder() {
            let orderItems = [];
            let totalAmount = 0;
            menuItems.forEach(i => {
                if(cart[i.id]) {
                    orderItems.push({ name: i.name, qty: cart[i.id], price: i.price });
                    totalAmount += cart[i.id] * i.price;
                }
            });

            const orderData = {
                orderId: `#DC-${tableNo}-` + Math.floor(100 + Math.random() * 900),
                tableNo: tableNo,
                customerName: document.getElementById('custName').value || 'Guest',
                items: orderItems,
                total: totalAmount,
                status: 'NEW ORDER',
                timestamp: Date.now()
            };

            db.ref('orders').push(orderData);
            alert("🎉 Order placed successfully!");
            cart = {};
            updateCartBar();
        }
    </script>
</body>
</html>
