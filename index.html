<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Cafe - Customer Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f5f0; color: #2c221e; }
    </style>
</head>
<body class="pb-32 min-h-screen antialiased">

    <!-- HEADER -->
    <header class="sticky top-0 bg-white/90 backdrop-blur-md z-20 border-b border-stone-200 px-4 py-3.5 flex justify-between items-center shadow-xs">
        <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 bg-amber-500 text-stone-950 rounded-2xl flex items-center justify-center font-bold text-lg shadow-sm">☕</div>
            <div>
                <h1 class="text-base font-extrabold text-stone-900">Demo Cafe</h1>
                <span id="tableBadge" class="text-[10px] font-extrabold bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full">TABLE #1</span>
            </div>
        </div>
    </header>

    <!-- CUSTOMER DETAILS INPUT -->
    <section class="p-4 bg-amber-500/10 border-b border-amber-200/50">
        <div class="flex gap-2">
            <input type="text" id="custName" placeholder="आपका नाम (Your Name)" class="w-1/2 px-3 py-2 bg-white border border-stone-200 rounded-xl text-xs font-semibold">
            <input type="tel" id="custPhone" placeholder="फ़ोन नंबर (Mobile)" class="w-1/2 px-3 py-2 bg-white border border-stone-200 rounded-xl text-xs font-semibold">
        </div>
    </section>

    <!-- MENU LIST -->
    <main class="p-4">
        <h2 class="text-xs font-extrabold text-stone-400 uppercase tracking-wider mb-3">Today's Special Menu</h2>
        <div id="menuContainer" class="space-y-3"></div>
    </main>

    <!-- FLOATING CART BAR -->
    <div id="cartBar" class="fixed bottom-5 left-4 right-4 bg-stone-900 text-white rounded-2xl p-4 shadow-2xl flex justify-between items-center hidden z-30">
        <div>
            <p id="cartItemsCount" class="text-[10px] font-bold text-amber-400">0 ITEMS</p>
            <p id="cartTotal" class="text-lg font-black text-white">₹0</p>
        </div>
        <button onclick="placeOrder()" class="font-bold text-xs bg-amber-500 text-stone-950 px-5 py-3 rounded-xl shadow-lg">Place Order ➔</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeZq246X-z908x-Il0F-m86c1DaTXlgI4",
            authDomain: "fir-cafe-bd31f.firebaseapp.com",
            databaseURL: "https://fir-cafe-bd31f-default-rtdb.firebaseio.com",
            projectId: "fir-cafe-bd31f",
            storageBucket: "fir-cafe-bd31f.firebasestorage.app",
            messagingSenderId: "277510970587",
            appId: "1:277510970587:web:3836a5c62df85e26df00fe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const tableNo = urlParams.get('table') || '1';

        let menuItems = [];
        let cart = {};

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tableBadge').innerText = `TABLE #${tableNo}`;
            
            // Listen to Live Menu from Firebase
            db.ref('menu').on('value', (snapshot) => {
                const data = snapshot.val();
                menuItems = [];
                if(data) {
                    Object.keys(data).forEach(key => {
                        menuItems.push({ firebaseKey: key, ...data[key] });
                    });
                }
                renderMenu();
            });
        });

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            if(menuItems.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-stone-400 text-xs font-semibold">मेनू लोड हो रहा है या अभी कोई डिश उपलब्ध नहीं है...</div>`;
                return;
            }

            menuItems.forEach(item => {
                const isAvailable = item.inStock !== false;
                container.innerHTML += `
                    <div class="bg-white p-3.5 rounded-2xl border border-stone-200/80 flex justify-between gap-3 items-center shadow-xs ${!isAvailable ? 'opacity-40' : ''}">
                        <div class="space-y-1 flex-1">
                            <h3 class="font-bold text-stone-900 text-sm">${item.name}</h3>
                            <p class="text-xs font-black text-stone-800">₹${item.price}</p>
                        </div>
                        <div class="shrink-0">
                            ${isAvailable ? `<button onclick="addToCart('${item.firebaseKey}')" class="bg-amber-500 text-stone-950 font-extrabold px-4 py-2 rounded-xl text-xs shadow-xs active:scale-95 transition-transform">+ Add</button>` : '<span class="text-[9px] font-black bg-red-100 text-red-600 px-2 py-1 rounded-lg">OUT OF STOCK</span>'}
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(key) {
            cart[key] = (cart[key] || 0) + 1;
            updateCartBar();
        }

        function updateCartBar() {
            let totalCount = 0, totalAmount = 0;
            menuItems.forEach(i => {
                if(cart[i.firebaseKey]) {
                    totalCount += cart[i.firebaseKey];
                    totalAmount += cart[i.firebaseKey] * i.price;
                }
            });

            if(totalCount > 0) {
                document.getElementById('cartBar').classList.remove('hidden');
                document.getElementById('cartItemsCount').innerText = `${totalCount} ITEMS ADDED`;
                document.getElementById('cartTotal').innerText = `₹${totalAmount}`;
            } else {
                document.getElementById('cartBar').classList.add('hidden');
            }
        }

        function placeOrder() {
            let orderItems = [];
            let totalAmount = 0;
            menuItems.forEach(i => {
                if(cart[i.firebaseKey]) {
                    orderItems.push({ name: i.name, qty: cart[i.firebaseKey], price: i.price });
                    totalAmount += cart[i.firebaseKey] * i.price;
                }
            });

            const orderData = {
                orderId: `#DC-${tableNo}-` + Math.floor(100 + Math.random() * 900),
                tableNo: tableNo,
                customerName: document.getElementById('custName').value || 'Guest',
                customerPhone: document.getElementById('custPhone').value || 'N/A',
                items: orderItems,
                total: totalAmount,
                status: 'NEW ORDER',
                timestamp: Date.now()
            };

            db.ref('orders').push(orderData);
            alert("🎉 आपका आर्डर किचन में भेज दिया गया है!");
            cart = {};
            updateCartBar();
        }
    </script>
</body>
</html>
