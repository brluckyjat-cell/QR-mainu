<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chaya Ceremony</title>

<link
rel="stylesheet"
href="style.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="main-header">

    <div class="logo">
        ☕ Demo Cafe
    </div>

    <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="#menu">Menu</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <button class="cart-btn" onclick="openCart()">
        🛒 Cart
    </button>

</header>

</header>
<section class="hero">

    <div class="hero-content">

        <h1>
            Premium Cafe Experience
        </h1>

        <p>
            Fresh coffee, delicious food aur ek modern cafe feel.
        </p>

        <button class="primary-btn" onclick="scrollToMenu()">
            Explore Menu
        </button>

    </div>

</section>
<section id="hero">

</section>

<section id="searchSection">

</section>

<section id="categorySection">

</section>

<section id="menu" class="menu-section">

    <h2>Our Menu</h2>

    <div class="category-list">

        <button onclick="showCategory('chai')">
            ☕ Chai & Coffee
        </button>

        <button onclick="showCategory('patties')">
            🥐 Patties
        </button>

        <button onclick="showCategory('burger')">
            🍔 Burgers
        </button>

        <button onclick="showCategory('pizza')">
            🍕 Pizza
        </button>

        <button onclick="showCategory('sandwich')">
            🥪 Sandwich
        </button>

        <button onclick="showCategory('fries')">
            🍟 French Fries
        </button>

        <button onclick="showCategory('cold')">
            🥤 Cold Drink
        </button>

        <button onclick="showCategory('cigarette')">
            🚬 Cigarette
        </button>

    </div>


    <div id="product-container" class="menu-grid">

        <!-- Products yaha load honge -->

    </div>

</section>

</section>

<div id="floatingCart">

</div>

<div id="cartDrawer">

</div>

<div id="orderSuccess">

</div>

<script src="app.js"></script>

</body>

</html>
